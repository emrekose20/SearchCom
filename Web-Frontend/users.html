<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullanıcı İşlemleri</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h2>Kullanıcı İşlemleri</h2>
      <a class="back-link" href="index.html">Ana Sayfaya Dön</a>
    </div>

    <div id="activeUserBox" class="user-pill hidden"></div>

    <div class="grid">

      <div class="card">
        <h3>Giriş Yap</h3>
        <label>Email</label>
        <input id="loginEmail" placeholder="ali@test.com" />

        <label>Şifre</label>
        <input id="loginPassword" type="password" placeholder="1234" />

        <div class="btn-row">
          <button onclick="loginUser()">Giriş Yap</button>
          <button class="secondary" onclick="logoutUser()">Çıkış Yap</button>
        </div>
      </div>

      <div class="card">
        <h3>Kullanıcı Oluştur</h3>

        <label>İsim</label>
        <input id="registerName" placeholder="Ad Soyad" />

        <label>Email</label>
        <input id="registerEmail" placeholder="ornek@mail.com" />

        <label>Şifre</label>
        <input id="registerPassword" type="password" placeholder="1234" />

        <div class="btn-row">
          <button onclick="registerUser()">Kullanıcı Oluştur</button>
        </div>
      </div>

      <div class="card">
        <h3>Kullanıcı Getir</h3>

        <label>Kullanıcı ID</label>
        <input id="getUserId" placeholder="Mongo kullanıcı id" />

        <div class="btn-row">
          <button class="secondary" onclick="getUser()">Bilgileri Getir</button>
        </div>
      </div>

      <div class="card">
        <h3>Kullanıcı Güncelle</h3>

        <label>Kullanıcı ID</label>
        <input id="updateUserId" placeholder="Boş bırakılırsa giriş yapan kullanılır" />

        <label>Yeni İsim</label>
        <input id="updateUserName" placeholder="Yeni isim" />

        <label>Yeni Şifre</label>
        <input id="updateUserPassword" type="password" placeholder="Yeni şifre" />

        <div class="btn-row">
          <button onclick="updateUser()">Güncelle</button>
        </div>
      </div>

      <div class="card">
        <h3>Kullanıcı Sil</h3>

        <label>Kullanıcı ID</label>
        <input id="deleteUserId" placeholder="Boş bırakılırsa giriş yapan kullanılır" />

        <div class="btn-row">
          <button class="danger" onclick="deleteUser()">Kullanıcıyı Sil</button>
        </div>
      </div>

    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="js/users.js"></script>
</body>
</html>
